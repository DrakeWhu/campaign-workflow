name: SUNRISE runtime inspector tests

on:
  pull_request:
    paths:
      - ".agents/skills/sunrise-runtime/**"
      - "tests/test_sunrise_runtime_inspector.py"
      - ".github/workflows/sunrise-runtime-inspector.yml"
permissions:
  contents: read

jobs:
  inspector-unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test standalone runtime inspector
        run: python -B -m unittest discover -s tests -p 'test_sunrise_runtime_inspector.py' -v
